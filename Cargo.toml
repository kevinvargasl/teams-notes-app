[package]
name = "notes-app"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1"
coreaudio = { version = "0.6.2", features = ["process-tap"] }
gpui-kit = "0.10"
hound = "3.5"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav"] }
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
whisper-rs = { version = "0.16", features = ["metal"] }
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
tempfile = "3"
objc2 = "0.6"
time = { version = "0.3", features = ["local-offset"] }
